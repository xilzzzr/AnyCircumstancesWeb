name: Security and test gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Scan current tree for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]+)' -- .             ':!SECURITY_AUDIT.md' ':!package-lock.json' ':!backend/package-lock.json'; then
            echo "Potential secret material found in the current tree."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

      - name: Frontend tests
        run: npm test

      - name: Frontend lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify production assets
        run: node scripts/verify-build-assets.mjs

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Backend tests
        working-directory: backend
        run: npm test
