name: Security and test gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: release-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v7

      - name: Scan current tree for obvious secrets
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk_live_[A-Za-z0-9]+|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]+)' -- .             ':!SECURITY_AUDIT.md' ':!package-lock.json' ':!backend/package-lock.json'; then
            echo "Potential secret material found in the current tree."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Backend syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in backend/*.js; do
            node --check "$file"
          done

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend dependency audit
        run: npm audit --audit-level=high

      - name: Frontend tests
        run: npm test

      - name: Encryption and share flow regression tests
        run: npm run test:crypto

      - name: Frontend type checks
        run: npm run typecheck

      - name: Frontend lint (legacy report)
        continue-on-error: true
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify production assets
        run: |
          node scripts/verify-build-assets.mjs
          python3 scripts/verify-public.py

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: MySQL release integration tests
        working-directory: backend
        env:
          MYSQL_TEST_HOST: 127.0.0.1
          MYSQL_TEST_USER: root
          MYSQL_TEST_PASSWORD: release-test-password
        run: npm run test:mysql
