name: Refresh security lockfiles

on:
  push:
    branches: ["security/prelaunch-hardening-2026-09-23"]

permissions:
  contents: write

concurrency:
  group: refresh-security-lockfiles
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/prelaunch-hardening-2026-09-23
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only
      - run: npm audit fix || true
      - run: npm install --package-lock-only
        working-directory: backend
      - run: npm audit fix || true
        working-directory: backend
      - name: Commit patched lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed"
          else
            git commit -m "Patch vulnerable npm dependencies"
            git fetch origin security/prelaunch-hardening-2026-09-23
            git rebase origin/security/prelaunch-hardening-2026-09-23
            git push origin HEAD:security/prelaunch-hardening-2026-09-23
          fi
